<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Workshop Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* ── Pink Watercolor Background ── */
        body.watercolor-bg {
            position: relative;
            min-height: 100vh;
            background: url('bg-desktop.png') no-repeat center center fixed;
            background-size: 100% 100%;
            background-color: #fde8ec;
            overflow-x: hidden;
        }

        /* Mobile background */
        @media (max-width: 768px) {
            body.watercolor-bg {
                background-image: url('bg-mobile.jpg');
                background-attachment: scroll;
            }
        }
    </style>
</head>
<body class="watercolor-bg min-h-screen text-gray-800 font-sans">

    <div class="max-w-6xl mx-auto p-4 sm:p-6 lg:p-8">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-gray-900">Workshop Registrations</h1>
                <p class="text-sm text-gray-500 mt-1">Manage attendee check-ins and live statistics.</p>
            </div>
            <button onclick="fetchAttendees()" class="bg-white border border-gray-200 hover:bg-gray-50 px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition">
                🔄 Refresh List
            </button>
        </header>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                <p class="text-xs font-semibold uppercase tracking-wider text-gray-400">Total Signups</p>
                <p id="statTotal" class="text-3xl font-bold text-gray-900 mt-1">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                <p class="text-xs font-semibold uppercase tracking-wider text-green-500">Checked In</p>
                <p id="statAttended" class="text-3xl font-bold text-green-600 mt-1">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                <p class="text-xs font-semibold uppercase tracking-wider text-amber-500">Absent / Pending</p>
                <p id="statAbsent" class="text-3xl font-bold text-amber-600 mt-1">0</p>
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm mb-6 flex items-center">
            <div class="w-full relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">🔍</span>
                <input type="text" id="searchBar" oninput="filterTable()" class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:bg-white focus:ring-2 focus:ring-rose-500 transition" placeholder="Search by name or email address...">
            </div>
        </div>

        <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-100 text-xs font-semibold uppercase tracking-wider text-gray-500">
                            <th class="p-4">Full Name</th>
                            <th class="p-4">Contact Information</th>
                            <th class="p-4 text-center">Attendance Checklist</th>
                        </tr>
                    </thead>
                    <tbody id="attendeeTableBody" class="divide-y divide-gray-50 text-sm">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="snapshotOverlay" class="fixed inset-0 bg-gray-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 transition-opacity" onclick="closeSnapshot()">
        <div class="bg-white rounded-2xl shadow-2xl p-4 max-w-lg w-full transform transition-all relative" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-900">Payment Snapshot</h3>
                <button onclick="closeSnapshot()" class="text-gray-400 hover:text-rose-500 bg-gray-100 hover:bg-rose-50 rounded-full w-8 h-8 flex items-center justify-center transition">
                    ✕
                </button>
            </div>
            <div class="bg-gray-50 rounded-xl overflow-hidden border border-gray-100 flex items-center justify-center min-h-[300px]">
                <img id="snapshotImg" src="" alt="Payment Receipt" class="max-w-full h-auto max-h-[70vh] object-contain rounded-lg">
            </div>
        </div>
    </div>

    <script>
      
        const SUPABASE_URL = 'https://xoyjkjsmbzxtrxnwvbbt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhveWpranNtYnp4dHJ4bnd2YmJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1Mjg3NzEsImV4cCI6MjA5NzEwNDc3MX0.STBEdR-p519Qcab1M1BojZJe-DNIE2JxyRVjGbHwMXM';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allAttendees = []; // Global memory array for searching

        // Fetch attendees directly from Cloud Database
        async function fetchAttendees() {
            try {
                const { data, error } = await supabaseClient
                    .from('workshop_registrations')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;

                // Automatically fix legacy data: If they uploaded a snapshot, they should be marked as paid
                allAttendees = data.map(person => {
                    let updatedPerson = { ...person };
                    // If they have a valid receipt image but are still marked unpaid
                    if (updatedPerson.receipt && updatedPerson.receipt.length > 20 && !updatedPerson.paid) {
                        updatedPerson.paid = true;
                        // Silently update Supabase in the background to correct the data
                        supabaseClient.from('workshop_registrations')
                            .update({ paid: true })
                            .eq('id', updatedPerson.id).then();
                    }
                    return updatedPerson;
                });
                renderTable(allAttendees);
            } catch (err) {
                console.error(err);
                document.getElementById('attendeeTableBody').innerHTML = `
                    <tr><td colspan="3" class="p-8 text-center text-red-500">Could not fetch cloud database records. Check your credentials.</td></tr>
                `;
            }
        }

        function calculateStats(data) {
            const total = data.length;
            const attended = data.filter(a => a.attended).length;
            const absent = total - attended;

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statAttended').innerText = attended;
            document.getElementById('statAbsent').innerText = absent;
        }

        function renderTable(data) {
            calculateStats(data);
            const tbody = document.getElementById('attendeeTableBody');
            
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-gray-400">No registrations found matching description.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(person => `
                <tr class="hover:bg-gray-50/70 transition">
                    <td class="p-4 font-semibold text-gray-900">${person.full_name}</td>
                    <td class="p-4 text-gray-500">
                        <div>📧 ${person.email}</div>
                        <div class="text-xs mt-0.5">📞 ${person.phone_number}</div>
                    </td>
                    <td class="p-4 text-center">
                        <div class="flex items-center justify-center gap-2">
                            ${person.receipt ? `
                            <button onclick="viewSnapshot('${person.id}')" 
                                class="px-3 py-1.5 rounded-full text-xs font-semibold bg-purple-50 text-purple-700 border border-purple-200 hover:bg-purple-100 transition">
                                🖼️ Snapshot
                            </button>` : ''}
                            <button onclick="togglePayment(${person.id}, ${person.paid})" 
                                class="px-3 py-1.5 rounded-full text-xs font-semibold transition border ${
                                    person.paid 
                                    ? 'bg-blue-50 text-blue-700 border-blue-200 hover:bg-blue-100' 
                                    : 'bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100'
                                }">
                                ${person.paid ? '💰 Paid' : '⏳ Unpaid'}
                            </button>
                            <button onclick="toggleAttendance(${person.id}, ${person.attended})" 
                                class="px-3 py-1.5 rounded-full text-xs font-semibold transition border ${
                                    person.attended 
                                    ? 'bg-green-50 text-green-700 border-green-200 hover:bg-green-100' 
                                    : 'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100'
                                }">
                                ${person.attended ? '✓ Checked In' : '✗ Absent'}
                            </button>
                            <button onclick="deleteAttendee(${person.id})" title="Delete"
                                class="p-1.5 rounded-full text-red-400 hover:bg-red-50 hover:text-red-600 transition">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function filterTable() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const filtered = allAttendees.filter(p => 
                p.full_name.toLowerCase().includes(query) || 
                p.email.toLowerCase().includes(query)
            );
            renderTable(filtered);
        }

        async function toggleAttendance(id, currentStatus) {
            try {
                const { error } = await supabaseClient
                    .from('workshop_registrations')
                    .update({ attended: !currentStatus })
                    .eq('id', id);

                if (error) throw error;

                allAttendees = allAttendees.map(p => p.id === id ? { ...p, attended: !currentStatus } : p);
                filterTable();
            } catch (error) {
                console.error(error);
                alert("Failed to sync attendance update with the cloud database.");
            }
        }

        async function togglePayment(id, currentStatus) {
            try {
                const { error } = await supabaseClient
                    .from('workshop_registrations')
                    .update({ paid: !currentStatus })
                    .eq('id', id);

                if (error) throw error;

                allAttendees = allAttendees.map(p => p.id === id ? { ...p, paid: !currentStatus } : p);
                filterTable();
            } catch (error) {
                console.error(error);
                alert("Failed to sync payment update with the cloud database.");
            }
        }

        async function deleteAttendee(id) {
            if (confirm("Are you sure you want to delete this registration?")) {
                try {
                    const { error } = await supabaseClient
                        .from('workshop_registrations')
                        .delete()
                        .eq('id', id);

                    if (error) throw error;

                    allAttendees = allAttendees.filter(p => p.id !== id);
                    filterTable();
                } catch (error) {
                    console.error(error);
                    alert("Failed to delete the registration from the cloud database.");
                }
            }
        }

        // Initial fetch when the dashboard window loads up
        window.onload = fetchAttendees;

        // ─── SNAPSHOT VIEWER MODAL ───
        function viewSnapshot(id) {
            const person = allAttendees.find(p => String(p.id) === String(id));
            if (person && person.receipt) {
                document.getElementById('snapshotImg').src = person.receipt;
                document.getElementById('snapshotOverlay').classList.remove('hidden');
            }
        }

        function closeSnapshot() {
            document.getElementById('snapshotOverlay').classList.add('hidden');
            document.getElementById('snapshotImg').src = '';
        }
    </script>
</body>
</html>
